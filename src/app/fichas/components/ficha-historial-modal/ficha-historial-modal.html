@if (isOpen()) {
  <div
    class="modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="titulo-historial"
    (click)="onBackdropClick($event)"
  >
    <div class="modal-panel">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            class="icon-amber"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M12 7v5l4 2" />
          </svg>
          <h3 id="titulo-historial">Historial de Cambios</h3>
        </div>
        <button
          type="button"
          class="btn-close-icon"
          aria-label="Cerrar historial"
          (click)="close.emit()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>

      <div class="history-list">
        @for (item of historial(); track item.id) {
          <div class="history-item">
            <div>
              <p class="history-title">{{ item.titulo }}</p>
              <p class="history-detail">{{ item.detalle }}</p>
            </div>
            <span class="history-date">{{ item.fecha }}</span>
          </div>
        } @empty {
          <p class="empty-history">No hay cambios registrados todavía.</p>
        }
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="close.emit()">Cerrar</button>
      </div>
    </div>
  </div>
}
