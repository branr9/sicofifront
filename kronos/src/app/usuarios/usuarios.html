<section class="gestion-usuarios">
  <h1 class="titulo">Gestión de Usuarios</h1>

  <div class="barra-superior">
    <div class="buscador">
      <input
        type="text"
        class="input-buscar"
        placeholder="Buscar usuario..."
        [value]="busqueda()"
        (input)="onBuscar($event)"
      />
      <svg
        class="icono-lupa"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7" />
        <line x1="16.65" y1="16.65" x2="21" y2="21" />
      </svg>
    </div>

    <button type="button" class="btn-crear">+ Crear Usuario</button>
  </div>

  <div class="tabla-marco">
    <table class="tabla-usuarios">
      <thead>
        <tr>
          <th>Documento</th>
          <th>Nombre</th>
          <th>Rol</th>
          <th>Estado</th>
          <th class="col-acciones">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (u of usuariosFiltrados(); track u.documento) {
          <tr>
            <td class="col-doc">{{ u.documento }}</td>
            <td>{{ u.nombre }}</td>
            <td>{{ u.rol }}</td>
            <td>{{ u.estado }}</td>
            <td class="col-acciones">
              <button type="button" class="btn-icono" title="Editar" aria-label="Editar usuario">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 20h9" />
                  <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
                </svg>
              </button>

              <button
                type="button"
                class="btn-icono"
                title="Eliminar"
                aria-label="Eliminar usuario"
                (click)="eliminarUsuario(u.documento)"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6" />
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                  <path d="M10 11v6" />
                  <path d="M14 11v6" />
                  <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                </svg>
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="sin-datos">No se encontraron usuarios.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="paginacion">
    <button type="button" class="btn-pagina" aria-label="Página anterior">&lt;</button>
    <span class="pagina-actual">1</span>
    <button type="button" class="btn-pagina" aria-label="Página siguiente">&gt;</button>
  </div>

  <p class="nota-pie">* La papelera elimina usuarios del sistema.</p>
</section>
